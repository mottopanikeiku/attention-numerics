name: Explorable and Pages
on:
  push:
    branches: [main, night2-explorable]
  pull_request:
    paths: ['site/**', '.github/workflows/pages.yml', 'results/v2/heads.csv', 'attention.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.5'
      - run: uv sync --locked --python 3.13
      - run: uv run python site/export.py
      - run: git diff --exit-code -- site/heads.json site/fp8-fixture.json
      - run: node --test site/test.mjs
      - name: Prepare static files
        run: |
          mkdir -p _site
          cp site/index.html site/style.css site/app.mjs site/numerics.mjs site/heads.json _site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
