[project]
name = "attention-numerics"
version = "0.1.0"
description = "CPU emulation of rounding error in tiled low-precision attention"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "ml-dtypes>=0.5,<0.6", "matplotlib>=3.9,<4"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<0.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
